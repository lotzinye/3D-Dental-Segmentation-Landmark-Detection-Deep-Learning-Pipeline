<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 700" width="940" height="700" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="940" height="700" fill="#ffffff"/>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="470" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Automated Tooth Segmentation &amp; Landmark Detection Pipeline</text>
  <text x="470" y="50" text-anchor="middle" font-size="12" fill="#64748b">Raw intraoral jaw scan (.obj) → FDI-labelled mesh + 6-class anatomical landmarks</text>

  <!-- INPUT -->
  <rect x="360" y="70" width="220" height="38" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="470" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Input: jaw mesh (.obj), ~100k vertices</text>
  <line x1="470" y1="108" x2="470" y2="132" stroke="#475569" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- STAGE 1 -->
  <rect x="40" y="134" width="860" height="140" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="40" y="134" width="860" height="26" rx="8" fill="#2563eb"/>
  <rect x="40" y="150" width="860" height="10" fill="#2563eb"/>
  <text x="56" y="152" font-size="13" font-weight="700" fill="#ffffff">STAGE 1 — Tooth Instance Segmentation</text>
  <text x="884" y="152" text-anchor="end" font-size="11" fill="#dbeafe">Point Transformer encoder–decoder + boundary refinement</text>

  <g font-size="11" fill="#0f172a">
    <rect x="58" y="178" width="122" height="72" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
    <text x="119" y="200" text-anchor="middle" font-weight="600">Normalise</text>
    <text x="119" y="217" text-anchor="middle" font-size="10" fill="#475569">Y-extent = 1.8</text>
    <text x="119" y="231" text-anchor="middle" font-size="10" fill="#475569">dedupe + midpoint</text>
    <text x="119" y="243" text-anchor="middle" font-size="10" fill="#475569">subdivision</text>

    <rect x="198" y="178" width="112" height="72" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
    <text x="254" y="200" text-anchor="middle" font-weight="600">FPS</text>
    <text x="254" y="219" text-anchor="middle" font-size="10" fill="#475569">24,000 points</text>
    <text x="254" y="233" text-anchor="middle" font-size="10" fill="#475569">uniform coverage</text>

    <rect x="328" y="178" width="168" height="72" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
    <text x="412" y="199" text-anchor="middle" font-weight="600">Point Transformer U-Net</text>
    <text x="412" y="217" text-anchor="middle" font-size="10" fill="#475569">5 SA layers  32→512 dim</text>
    <text x="412" y="230" text-anchor="middle" font-size="10" fill="#475569">5 FP layers + skips</text>
    <text x="412" y="243" text-anchor="middle" font-size="10" fill="#475569">instance + semantic labels</text>

    <rect x="514" y="178" width="150" height="72" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
    <text x="589" y="199" text-anchor="middle" font-weight="600">Boundary-Aware Net</text>
    <text x="589" y="217" text-anchor="middle" font-size="10" fill="#475569">no downsampling</text>
    <text x="589" y="230" text-anchor="middle" font-size="10" fill="#475569">bdl_ratio &lt; 0.7 pts only</text>
    <text x="589" y="243" text-anchor="middle" font-size="10" fill="#475569">planes [16, 32]</text>

    <rect x="682" y="178" width="200" height="72" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
    <text x="782" y="199" text-anchor="middle" font-weight="600">KDTree propagation</text>
    <text x="782" y="217" text-anchor="middle" font-size="10" fill="#475569">24k samples → all vertices</text>
    <text x="782" y="230" text-anchor="middle" font-size="10" fill="#475569">FDI code assignment</text>
    <text x="782" y="243" text-anchor="middle" font-size="10" fill="#475569">TSA 0.9838 · TLA 0.9492</text>
  </g>

  <line x1="180" y1="214" x2="196" y2="214" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="310" y1="214" x2="326" y2="214" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="496" y1="214" x2="512" y2="214" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="664" y1="214" x2="680" y2="214" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>

  <line x1="470" y1="274" x2="470" y2="296" stroke="#475569" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- STAGE 2 -->
  <rect x="40" y="298" width="860" height="128" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="40" y="298" width="860" height="26" rx="8" fill="#7c3aed"/>
  <rect x="40" y="314" width="860" height="10" fill="#7c3aed"/>
  <text x="56" y="316" font-size="13" font-weight="700" fill="#ffffff">STAGE 2 — Coordinate-Space Bridge</text>
  <text x="884" y="316" text-anchor="end" font-size="11" fill="#ede9fe">core contribution — reconciles two incompatible normalisations</text>

  <g font-size="11" fill="#0f172a">
    <rect x="58" y="342" width="150" height="64" rx="5" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.4"/>
    <text x="133" y="363" text-anchor="middle" font-weight="600">Stage-1 space</text>
    <text x="133" y="381" text-anchor="middle" font-size="10" fill="#475569">fixed range</text>
    <text x="133" y="394" text-anchor="middle" font-size="10" fill="#475569">Y-extent = 1.8 units</text>

    <rect x="242" y="342" width="150" height="64" rx="5" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.4"/>
    <text x="317" y="363" text-anchor="middle" font-weight="600">Physical mm</text>
    <text x="317" y="381" text-anchor="middle" font-size="10" fill="#475569">(c + 0.8) × scale</text>
    <text x="317" y="394" text-anchor="middle" font-size="10" fill="#475569">+ min_y_c</text>

    <rect x="426" y="342" width="150" height="64" rx="5" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.4"/>
    <text x="501" y="363" text-anchor="middle" font-weight="600">Stage-3 z-space</text>
    <text x="501" y="381" text-anchor="middle" font-size="10" fill="#475569">fixed dispersion</text>
    <text x="501" y="394" text-anchor="middle" font-size="10" fill="#475569">÷ σ = 17.3281</text>

    <rect x="610" y="342" width="136" height="64" rx="5" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.4"/>
    <text x="678" y="363" text-anchor="middle" font-weight="600">KDTree crop</text>
    <text x="678" y="381" text-anchor="middle" font-size="10" fill="#475569">k = 12,000 per tooth</text>
    <text x="678" y="394" text-anchor="middle" font-size="10" fill="#475569">fixed tensor shape</text>

    <rect x="768" y="342" width="114" height="64" rx="5" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.4"/>
    <text x="825" y="363" text-anchor="middle" font-weight="600">PointTensor</text>
    <text x="825" y="381" text-anchor="middle" font-size="10" fill="#475569">C (N,3) + F (N,9)</text>
    <text x="825" y="394" text-anchor="middle" font-size="10" fill="#475569">xyz|normals|offsets</text>
  </g>

  <line x1="208" y1="374" x2="240" y2="374" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="392" y1="374" x2="424" y2="374" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="576" y1="374" x2="608" y2="374" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="746" y1="374" x2="766" y2="374" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>

  <line x1="470" y1="426" x2="470" y2="448" stroke="#475569" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- STAGE 3 -->
  <rect x="40" y="450" width="860" height="146" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <rect x="40" y="450" width="860" height="26" rx="8" fill="#059669"/>
  <rect x="40" y="466" width="860" height="10" fill="#059669"/>
  <text x="56" y="468" font-size="13" font-weight="700" fill="#ffffff">STAGE 3 — Anatomical Landmark Detection</text>
  <text x="884" y="468" text-anchor="end" font-size="11" fill="#d1fae5">Stratified Transformer, 6 independent prediction heads</text>

  <g font-size="11" fill="#0f172a">
    <rect x="58" y="494" width="128" height="86" rx="5" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.4"/>
    <text x="122" y="515" text-anchor="middle" font-weight="600">KPConv embed</text>
    <text x="122" y="533" text-anchor="middle" font-size="10" fill="#475569">9 → 48 channels</text>
    <text x="122" y="546" text-anchor="middle" font-size="10" fill="#475569">ball r = 0.05</text>
    <text x="122" y="559" text-anchor="middle" font-size="10" fill="#475569">≈ 0.87 mm</text>

    <rect x="204" y="494" width="186" height="86" rx="5" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.4"/>
    <text x="297" y="515" text-anchor="middle" font-weight="600">Stratified encoder (CRPE)</text>
    <text x="297" y="533" text-anchor="middle" font-size="10" fill="#475569">12,000 → 3,120 → 811 → 211</text>
    <text x="297" y="546" text-anchor="middle" font-size="10" fill="#475569">48 → 96 → 192 → 256 dim</text>
    <text x="297" y="559" text-anchor="middle" font-size="10" fill="#475569">windows 1.7 / 3.5 / 6.9 mm</text>
    <text x="297" y="572" text-anchor="middle" font-size="10" fill="#475569">heads 6 / 12 / 24</text>

    <rect x="408" y="494" width="180" height="86" rx="5" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.4"/>
    <text x="498" y="515" text-anchor="middle" font-weight="600">6 decoder paths</text>
    <text x="498" y="533" text-anchor="middle" font-size="10" fill="#475569">seg · mesial_distal · facial</text>
    <text x="498" y="546" text-anchor="middle" font-size="10" fill="#475569">outer · inner · cusps</text>
    <text x="498" y="559" text-anchor="middle" font-size="10" fill="#475569">out_channels [1,4,4,4,4,4]</text>
    <text x="498" y="572" text-anchor="middle" font-size="10" fill="#475569">back to 12,000 × 48</text>

    <rect x="606" y="494" width="132" height="86" rx="5" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.4"/>
    <text x="672" y="515" text-anchor="middle" font-weight="600">Per-point votes</text>
    <text x="672" y="533" text-anchor="middle" font-size="10" fill="#475569">ch 0 = distance</text>
    <text x="672" y="546" text-anchor="middle" font-size="10" fill="#475569">ch 1–3 = Δx Δy Δz</text>
    <text x="672" y="562" text-anchor="middle" font-size="10" fill="#475569">filter d &lt; 0.12 (≈2.1 mm)</text>

    <rect x="756" y="494" width="126" height="86" rx="5" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.4"/>
    <text x="819" y="515" text-anchor="middle" font-weight="600">DBSCAN</text>
    <text x="819" y="533" text-anchor="middle" font-size="10" fill="#475569">eps = 0.03</text>
    <text x="819" y="546" text-anchor="middle" font-size="10" fill="#475569">min_points = 20</text>
    <text x="819" y="562" text-anchor="middle" font-size="10" fill="#475569">count-agnostic</text>
  </g>

  <line x1="186" y1="537" x2="202" y2="537" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="390" y1="537" x2="406" y2="537" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="588" y1="537" x2="604" y2="537" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="738" y1="537" x2="754" y2="537" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>

  <line x1="470" y1="596" x2="470" y2="618" stroke="#475569" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- OUTPUT -->
  <rect x="230" y="620" width="480" height="52" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="470" y="641" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Output: {stem}_landmarks.json + 8 colour-coded PLY layers</text>
  <text x="470" y="659" text-anchor="middle" font-size="10.5" fill="#475569">coordinates in mm · confidence score · anatomical class · inherited FDI tooth number</text>
</svg>
